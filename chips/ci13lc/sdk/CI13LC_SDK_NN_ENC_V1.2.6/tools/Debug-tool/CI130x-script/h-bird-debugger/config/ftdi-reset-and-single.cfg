adapter driver ftdi
adapter speed 29000

bindto 0.0.0.0

#ftdi device_desc "Dual RS232-HS"
ftdi vid_pid 0x0403 0x6010
ftdi oscan1_mode off

transport select jtag

ftdi layout_init 0x0008 0x001b
ftdi layout_signal nSRST -oe 0x0020 -data 0x0020
#
ftdi layout_signal TCK -data 0x0001
ftdi layout_signal TDI -data 0x0002
ftdi layout_signal TDO -input 0x0004
ftdi layout_signal TMS -data 0x0008
ftdi layout_signal JTAG_SEL -data 0x0100 -oe 0x0100


set _CHIPNAME0 riscv0
jtag newtap $_CHIPNAME0 cpu -irlen 5 -expected-id 0x13070a6d
set _TARGETNAME0 $_CHIPNAME0.cpu
target create $_TARGETNAME0 riscv -chain-position $_TARGETNAME0
$_TARGETNAME0 configure -work-area-phys 0x1ff50000 -work-area-size 10000 -work-area-backup 1

#set _CHIPNAME1 riscv1
#jtag newtap $_CHIPNAME1 cpu -irlen 5 -expected-id 0x13070a6d
#set _TARGETNAME1 $_CHIPNAME1.cpu
#target create $_TARGETNAME1 riscv -chain-position $_TARGETNAME1
#$_TARGETNAME1 configure -work-area-phys 0x1ffb0000 -work-area-size 10000 -work-area-backup 1

riscv set_reset_timeout_sec 1
#riscv set_prefer_sba on
#riscv set_mem_access
riscv set_command_timeout_sec 3
gdb_breakpoint_override hard

init

halt

mdw 0x400002D4

# 设置自旋指令
mww 0x1ff50000 0xA001

# 解锁
mww 0x40030000 0x51AC0FFE
sleep 1
# 设置复位模式
mww 0x40030010 0x00000020
# 复位
mww 0x40030014 0xDEADBEEF
#mww 0x40030000 0
# 复位
reset

init

halt




