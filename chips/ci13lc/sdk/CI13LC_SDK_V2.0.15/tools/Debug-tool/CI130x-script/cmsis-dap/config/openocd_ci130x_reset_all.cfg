adapter speed 40000
reset_config srst_only
adapter srst pulse_width 100

bindto 0.0.0.0

adapter driver cmsis-dap

transport select jtag

set _CHIPNAME0 riscv0
jtag newtap $_CHIPNAME0 cpu -irlen 5 -expected-id 0x13070a6d

set _TARGETNAME0 $_CHIPNAME0.cpu
target create $_TARGETNAME0 riscv -chain-position $_TARGETNAME0
$_TARGETNAME0 configure -work-area-phys 0x1ff50000 -work-area-size 10000 -work-area-backup 1

riscv set_reset_timeout_sec 1
riscv set_prefer_sba on
riscv set_command_timeout_sec 1
gdb_breakpoint_override hard

init

halt

mww 0x40030000 0x51AC0FFE
mww 0x0 0xa001
sleep 1
mww 0x40030010 0x00000020
mww 0x40030014 0xDEADBEEF
mww 0x40030000 0

exit

